<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>상품목록 관리</title><style>body{margin:0;background:#f4f7fb;color:#172033;font:14px Arial}.wrap{max-width:1100px;margin:auto;padding:26px 14px}.top{display:flex;justify-content:space-between;align-items:center}.top a{color:#2563eb}.card{background:#fff;border:1px solid #e3e8f0;border-radius:14px;padding:14px;margin:10px 0}.grid{display:grid;grid-template-columns:70px 1fr 130px 1fr 1fr 110px;gap:8px;align-items:center}.grid input{min-width:0;border:1px solid #d7deea;border-radius:7px;padding:9px}.button{border:0;border-radius:7px;padding:9px;background:#2563eb;color:#fff;cursor:pointer}.danger{background:#fee2e2;color:#b42318}.muted{color:#718096;font-size:12px}@media(max-width:700px){.grid{grid-template-columns:1fr}.grid input{width:100%;box-sizing:border-box}.button{width:100%}}</style></head><body><main class="wrap"><div class="top"><h1>상품목록 관리</h1><a href="/dashboard.html">← 상황판</a></div><p class="muted">루트 상품 검색 페이지에 표시되는 Supabase products 데이터입니다.</p><div id="list">불러오는 중…</div></main><script>const U='https://ybvnekkbbnhbcnnatkui.supabase.co',K='sb_publishable_0-6qJZXSmiKQKsoF5FQw-w_xH-PNfWD',H={apikey:K,Authorization:'Bearer '+K,'Content-Type':'application/json'};let rows=[];async function api(p,o={}){const r=await fetch(U+'/rest/v1/'+p,{...o,headers:{...H,...(o.headers||{})},cache:'no-store'});if(!r.ok)throw Error(await r.text());return r.status===204?null:r.json()}const e=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function render(){document.querySelector('#list').innerHTML=rows.map(x=>`<section class="card"><div class="grid"><input data="number" value="${e(x.number)}" placeholder="번호"><input data="title" value="${e(x.title)}" placeholder="상품명"><input data="category" value="${e(x.category)}" placeholder="카테고리"><input data="image" value="${e(x.image)}" placeholder="이미지 URL"><input data="link" value="${e(x.link)}" placeholder="상품 링크"><span><button class="button" onclick="save('${x.id}',this)">저장</button> <button class="button danger" onclick="del('${x.id}')">삭제</button></span></div></section>`).join('')||'<div class="card">상품이 없습니다.</div>'}async function load(){rows=await api('products?select=*&order=created_at.asc&limit=300');render()}async function save(id,b){const c=b.closest('.grid');const body={};c.querySelectorAll('input').forEach(i=>body[i.getAttribute('data')]=i.value);body.updated_at=new Date().toISOString();await api('products?id=eq.'+id,{method:'PATCH',headers:{Prefer:'return=minimal'},body:JSON.stringify(body)});await load()}async function del(id){if(!confirm('이 상품을 삭제할까요?'))return;await api('products?id=eq.'+id,{method:'DELETE'});await load()}load().catch(x=>document.querySelector('#list').textContent='연결 실패: '+x.message);</script></body></html>
