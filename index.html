<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f5f1e9" />
    <meta name="description" content="픽로그에서 영상 속 제품을 번호로 빠르게 찾아보세요." />
    <title>픽로그 | 영상 속 제품 찾기</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@500;600;700;800&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
    <script src="https://unpkg.com/lucide@latest"></script>
  </head>
  <body>
    <div class="mobile-canvas">
      <header class="topbar">
        <a class="brand" href="#top" aria-label="픽로그 홈"><span class="brand-mark"><i data-lucide="sparkles"></i></span><span>picklog<span class="brand-dot">.</span></span></a>
        <span class="header-status"><span class="live-dot"></span> DAILY PICKS</span>
      </header>
      <main id="top">
        <section class="intro">
          <p class="eyebrow">PRODUCT INDEX / 2026</p>
          <h1>영상 속 그 제품,<br /><em>여기서 찾으세요.</em></h1>
          <p class="intro-copy">리뷰 영상에서 눈여겨본 제품을<br />번호와 이름으로 빠르게 찾아보세요.</p>
          <div class="intro-rule"><span>01 — 24</span><span>UPDATED TODAY</span></div>
        </section>
        <section class="product-section" id="products">
          <div class="section-title"><div><p class="eyebrow">FIND YOUR PICK</p><h2>제품 목록<span class="accent">.</span></h2></div><span class="product-count" id="product-count">06 ITEMS</span></div>
          <div class="search-box"><i data-lucide="search"></i><input id="search-input" type="search" placeholder="제품 번호 또는 이름 검색" aria-label="제품 번호 또는 이름 검색" /><button id="clear-search" type="button" aria-label="검색어 지우기"><i data-lucide="x"></i></button></div>
          <div class="filter-tabs" role="tablist" aria-label="제품 카테고리 필터"><button class="filter active" data-filter="전체" type="button">전체</button><button class="filter" data-filter="생활" type="button">생활</button><button class="filter" data-filter="테크" type="button">테크</button><button class="filter" data-filter="뷰티" type="button">뷰티</button></div>
          <div class="product-list" id="product-list"></div>
          <p class="empty-state" id="empty-state">검색 결과가 없습니다.</p>
        </section>
        <section class="commission-note"><div class="note-icon"><i data-lucide="link-2"></i></div><div><strong>영상은 보고 오셨죠?</strong><p>마음에 든 제품을 바로 확인하고<br />공식 판매처에서 안전하게 구매하세요.</p></div></section>
      </main>
      <footer class="footer"><span>© 2026 PICKLOG</span><a href="mailto:hello@picklog.kr">제휴 문의 <i data-lucide="arrow-up-right"></i></a></footer>
    </div>
    <script src="app.js"></script>
  </body>
</html>
