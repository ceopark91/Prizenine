<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PrizeNine 작업 관리</title><style>body{margin:0;background:#f4f7fb;color:#172033;font:14px Arial,sans-serif}.wrap{max-width:1100px;margin:auto;padding:28px 16px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}.top h1{margin:0 0 18px;font-size:26px}.tools{display:flex;gap:8px;margin:12px 0 18px}.tools input,.tools select{border:1px solid #d7deea;border-radius:10px;padding:11px;background:#fff}.tools input{flex:1}.card{background:#fff;border:1px solid #e3e8f0;border-radius:14px;padding:14px;margin:10px 0;box-shadow:0 4px 16px #1720330a}.row{display:grid;grid-template-columns:1fr 130px 150px 100px;gap:10px;align-items:center}.url{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#2563eb}.muted{color:#718096;font-size:12px}.actions{display:flex;gap:6px;justify-content:flex-end}.actions button,.top a{border:0;border-radius:8px;padding:9px 12px;background:#2563eb;color:white;text-decoration:none;cursor:pointer}.actions .danger{background:#fee2e2;color:#b91c1c}.empty{text-align:center;padding:30px;color:#718096}@media(max-width:700px){.row{grid-template-columns:1fr}.actions{justify-content:stretch}.actions button{flex:1}.tools{flex-wrap:wrap}.tools input{flex-basis:100%}}</style></head><body><main class="wrap"><div class="top"><h1>PrizeNine 작업 관리</h1><a href="/dashboard.html">대시보드</a></div><div class="tools"><input id="q" placeholder="상품 URL·작업 ID·상품번호 검색"><select id="status"><option value="">전체 상태</option><option>pending</option><option>processing</option><option>done</option><option>failed</option></select><button id="refresh">새로고침</button></div><div id="list"><div class="empty">불러오는 중…</div></div></main><script>
const URL='https://ybvnekkbbnhbcnnatkui.supabase.co',KEY='sb_publishable_0-6qJZXSmiKQKsoF5FQw-w_xH-PNfWD',H={apikey:KEY,Authorization:'Bearer '+KEY,'Content-Type':'application/json'};let jobs=[];const $=s=>document.querySelector(s);async function api(p,o={}){const r=await fetch(URL+'/rest/v1/'+p,{...o,headers:{...H,...(o.headers||{})},cache:'no-store'});if(!r.ok)throw Error(await r.text());return r.status===204?null:r.json()}function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function render(){const q=$('#q').value.toLowerCase(),st=$('#status').value;const list=jobs.filter(j=>(!st||j.status===st)&&(!q||`${j.id} ${j.url} ${j.product_number}`.toLowerCase().includes(q)));$('#list').innerHTML=list.length?list.map(j=>`<section class="card"><div class="row"><div><div class="url" title="${esc(j.url)}">${esc(j.url)}</div><div class="muted">${esc(j.id)} · ${esc(j.created_at)}</div></div><select data-stage="${j.id}"><option ${j.stage==='RECEIVED'?'selected':''}>RECEIVED</option><option ${j.stage==='DIGGING_DONE'?'selected':''}>DIGGING_DONE</option><option ${j.stage==='SHEET_DONE'?'selected':''}>SHEET_DONE</option><option ${j.stage==='SCRIPT_READY'?'selected':''}>SCRIPT_READY</option><option ${j.stage==='REVIEW_APPROVED'?'selected':''}>REVIEW_APPROVED</option><option ${j.stage==='VIDEO_GENERATING'?'selected':''}>VIDEO_GENERATING</option><option ${j.stage==='VIDEO_READY'?'selected':''}>VIDEO_READY</option></select><input data-number="${j.id}" value="${esc(j.product_number||'')}" placeholder="상품번호"><div class="actions"><button onclick="save('${j.id}')">저장</button><button class="danger" onclick="removeJob('${j.id}')">삭제</button></div></div></section>`).join(''):'<div class="empty">작업이 없습니다.</div>'}async function load(){try{jobs=await api('jobs?select=*&order=created_at.desc&limit=200');render()}catch(e){$('#list').innerHTML='<div class="empty">Supabase 연결 실패: '+esc(e.message)+'</div>'}}async function save(id){const stage=document.querySelector(`[data-stage="${id}"]`).value,number=document.querySelector(`[data-number="${id}"]`).value;await api('jobs?id=eq.'+encodeURIComponent(id),{method:'PATCH',headers:{Prefer:'return=minimal'},body:JSON.stringify({stage,product_number:number||null,updated_at:new Date().toISOString()})});await load()}async function removeJob(id){if(!confirm('이 작업을 Supabase에서 삭제할까요?'))return;await api('jobs?id=eq.'+encodeURIComponent(id),{method:'DELETE'});await load()}$('#q').oninput=render;$('#status').onchange=render;$('#refresh').onclick=load;load();</script></body></html>
